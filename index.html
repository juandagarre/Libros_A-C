    let libroActual = 1;
    let listaActual = "A01";

    // Las listas se asignan automáticamente al libro por su letra inicial:
    // Axx -> Libro A, Bxx -> Libro B, Cxx -> Libro C.
    // Puedes pegar nuevas listas dentro de baseDatosListas y aparecerán
    // automáticamente en el libro correspondiente.
    function obtenerListasDelLibro(numLibro) {
        const prefijos = {
            1: "A",
            2: "B",
            3: "C"
        };

        const prefijo = prefijos[numLibro];

        return Object.keys(baseDatosListas)
            .filter(numLista =>
                numLista.startsWith(prefijo) &&
                Array.isArray(baseDatosListas[numLista])
            )
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    const nombresLibros = {
        1: "Libro A",
        2: "Libro B",
        3: "Libro C"
    };
    let indiceFrase = 0;
    let listaFrasesActiva = [];
    
    // Declaración global del motor de voz
    const synth = window.speechSynthesis;
    let indiceSecuencia = 0;
    let reproduciendoActivo = false;
    let modoActualSecuencia = 'EN';

    function seleccionarLibro(numLibro) {
        libroActual = numLibro;

        const botonesLibros = document.querySelectorAll('.btn-libro');
        botonesLibros.forEach((btn, index) => {
            if ((index + 1) === numLibro) {
                btn.classList.add('activo');
            } else {
                btn.classList.remove('activo');
            }
        });

        const listasDelLibro = obtenerListasDelLibro(numLibro);

        const contenedorListas = document.getElementById('contenedor-listas');
        contenedorListas.innerHTML = '';

        listasDelLibro.forEach(numLista => {
            const btn = document.createElement('button');
            btn.className = 'btn-lista';
            btn.innerText = `Lista ${numLista}`;
            btn.onclick = () => cargarLista(numLista);
            contenedorListas.appendChild(btn);
        });
    }

    function cargarLista(numLista) {
        listaActual = numLista;
        listaFrasesActiva = baseDatosListas[numLista] || baseDatosListas["A01"];
        indiceFrase = 0;

        document.getElementById('vista-menu').classList.add('oculto');
        document.getElementById('vista-estudio').classList.remove('oculto');
        
        actualizarFraseUI();
    }

    function actualizarFraseUI() {
        document.getElementById('marcador').innerText = `Frase ${indiceFrase + 1} de ${listaFrasesActiva.length} (Lista ${listaActual})`;
        document.getElementById('ingles').innerText = listaFrasesActiva[indiceFrase].en;
        document.getElementById('espanol').innerText = listaFrasesActiva[indiceFrase].es;
        
        document.getElementById('ingles').style.display = 'none';
        document.getElementById('espanol').style.display = 'none';
    }

    function mostrarIngles() {
        const el = document.getElementById('ingles');
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    }

    function mostrarEspanol() {
        const el = document.getElementById('espanol');
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    }

    function siguienteFrase() {
        if (indiceFrase < listaFrasesActiva.length - 1) {
            indiceFrase++;
            actualizarFraseUI();
        }
    }

    function anteriorFrase() {
        if (indiceFrase > 0) {
            indiceFrase--;
            actualizarFraseUI();
        }
    }

    function volverAlMenu() {
        reproduciendoActivo = false;
        synth.cancel();
        document.getElementById('vista-estudio').classList.add('oculto');
        document.getElementById('vista-secuencial').classList.add('oculto');
        document.getElementById('vista-menu').classList.remove('oculto');
    }

    function volverAEstudio() {
        reproduciendoActivo = false;
        synth.cancel();
        document.getElementById('vista-secuencial').classList.add('oculto');
        document.getElementById('vista-estudio').classList.remove('oculto');
    }

    function abrirVistaSecuencial() {
        document.getElementById('vista-estudio').classList.add('oculto');
        document.getElementById('vista-secuencial').classList.remove('oculto');
        document.getElementById('info-secuencial').innerText = `${nombresLibros[libroActual]} - Lista ${listaActual}`;
    }

    function leerIngles() {
        synth.cancel();
        const texto = listaFrasesActiva[indiceFrase].en;
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'en-US';
        synth.speak(utterance);
    }

    function leerEspanol() {
        synth.cancel();
        const texto = listaFrasesActiva[indiceFrase].es;
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        synth.speak(utterance);
    }

    function ocultarTextoSecuencial() {
        document.getElementById('contenedor-visualizacion').classList.add('oculto');
    }

    function visualizarTexto(modo) {
        const contenedor = document.getElementById('contenedor-visualizacion');
        contenedor.classList.remove('oculto');
        contenedor.innerHTML = '';

        listaFrasesActiva.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'item-visualizado';
            if (modo === 'EN') div.innerText = `${idx + 1}. ${item.en}`;
            if (modo === 'ES') div.innerText = `${idx + 1}. ${item.es}`;
            if (modo === 'EN-ES') div.innerText = `${idx + 1}. ${item.en} — ${item.es}`;
            if (modo === 'ES-EN') div.innerText = `${idx + 1}. ${item.es} — ${item.en}`;
            contenedor.appendChild(div);
        });
    }

    function reproducirSecuencia(modo) {
        modoActualSecuencia = modo;
        indiceSecuencia = 0; // Reinicia al principio al pulsar un botón verde nuevo
        iniciarBucleReproduccion();
    }

    function reanudarAudio() {
        if (!reproduciendoActivo) {
            iniciarBucleReproduccion(); // Retoma exactamente desde la frase donde se pausó
        }
    }

    function iniciarBucleReproduccion() {
        synth.cancel();
        if (listaFrasesActiva.length === 0) return;

        reproduciendoActivo = true;

        const velocidad = parseFloat(document.getElementById('velocidad-lectura').value) || 1;
        const vozEnLang = document.getElementById('select-voz-en').value || 'en-US';
        const vozEsLang = document.getElementById('select-voz-es').value || 'es-ES';
        const modo = modoActualSecuencia;

        function reproducirSiguiente() {
            if (!reproduciendoActivo || indiceSecuencia >= listaFrasesActiva.length) {
                reproduciendoActivo = false;
                return;
            }

            const fraseObj = listaFrasesActiva[indiceSecuencia];
            
            if (modo === 'EN') {
                hablarTexto(fraseObj.en, vozEnLang, velocidad, () => {
                    indiceSecuencia++;
                    reproducirSiguiente();
                });
            } else if (modo === 'ES') {
                hablarTexto(fraseObj.es, vozEsLang, velocidad, () => {
                    indiceSecuencia++;
                    reproducirSiguiente();
                });
            } else if (modo === 'EN-ES') {
                hablarTexto(fraseObj.en, vozEnLang, velocidad, () => {
                    if (!reproduciendoActivo) return;
                    hablarTexto(fraseObj.es, vozEsLang, velocidad, () => {
                        indiceSecuencia++;
                        reproducirSiguiente();
                    });
                });
            } else if (modo === 'ES-EN') {
                hablarTexto(fraseObj.es, vozEsLang, velocidad, () => {
                    if (!reproduciendoActivo) return;
                    hablarTexto(fraseObj.en, vozEnLang, velocidad, () => {
                        indiceSecuencia++;
                        reproducirSiguiente();
                    });
                });
            }
        }

        reproducirSiguiente();
    }

    function hablarTexto(texto, lang, velocidad, onEndCallback) {
        if (!reproduciendoActivo) return;
        let utter = new SpeechSynthesisUtterance(texto);
        utter.lang = lang;
        utter.rate = velocidad;
        utter.onend = () => {
            if (onEndCallback) onEndCallback();
        };
        utter.onerror = () => {
            if (onEndCallback) onEndCallback();
        };
        synth.speak(utter);
    }

    function pausarAudio() {
        reproduciendoActivo = false;
        synth.cancel(); // Detiene el sonido limpiamente y mantiene el índice listo para reanudar
    }
</script>
